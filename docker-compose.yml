services:
  postgres:
    image: postgres:17-alpine
    container_name: sultanat-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sultanat
      POSTGRES_PASSWORD: sultanat_dev
      POSTGRES_DB: sultanat_explore
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
